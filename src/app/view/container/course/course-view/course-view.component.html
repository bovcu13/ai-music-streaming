<p-scrollPanel [style]="{ width: '100%', height: '100%' }">
  <div class="flex flex-column">
    <div class="flex gap-5" style="height: 200px;">
      <div class="flex flex-column gap-3" style="width: 232px;">
        <p-image [src]="course.imageUrl"
                 styleClass="flex justify-content-center"
                 imageClass="border-round w-full"></p-image>
        <span class="font-bold text-3xl">{{course.price}}</span>
      </div>
      <div class="flex flex-column justify-content-end gap-3">
        <div class="flex gap-2">
          <div *ngFor="let type of course.type; let isLast = last" class="text-xs">
            <div class="flex gap-2 align-items-center">
              <span class="a-white-text">{{ type }}</span>
              <i class="pi pi-angle-right" *ngIf="!isLast"></i>
            </div>
          </div>
        </div>
        <span style="font-size: 48px">{{ course.course_name }}</span>
        <div class="flex gap-3 align-items-center">
          <p-tag value="{{course.tags}}" styleClass="bg-yellow-500"></p-tag>
          <span class="font-bold text-sm">
            <i class="mr-2 fa-solid fa-star"></i>{{ course.rating }} ({{ course.total_reviews }})</span>
          <span class="font-bold text-sm">
            <i class="mr-2 font-bold fa-regular fa-user"></i>{{ course.created_by }}</span>
        </div>
      </div>
    </div>
  </div>
</p-scrollPanel>

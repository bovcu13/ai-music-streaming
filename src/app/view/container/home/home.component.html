<div class="box" style="height: 100%">
  <div class="p-3 border-round-top">
    <div class="flex align-items-center">
      <div class="flex justify-content-start gap-2">
        <p-button icon="pi pi-chevron-left"
                  [style]="{ width: '30px', height: '30px' }"
                  [rounded]="true"
                  [text]="true"
                  styleClass="text-400"></p-button>
        <p-button icon="pi pi-chevron-right"
                  [style]="{ width: '30px', height: '30px' }"
                  [rounded]="true"
                  [text]="true"
                  styleClass="text-400"></p-button>
      </div>
      <div class="ml-auto flex gap-2">
        <p-button label="註冊"
                  [rounded]="true"
                  [text]="true"
                  [style]="{ height: '30px' }"
                  styleClass="text-400"></p-button>
        <p-button label="登入"
                  [rounded]="true"
                  [style]="{ height: '30px' }"
                  styleClass="bg-white"></p-button>
      </div>
    </div>
  </div>
  <div class="box-color p-3">
    <div class="flex justify-content-between align-items-center">
      <span class="text-2xl font-medium">播放清單</span>
      <p-button label="顯示所有內容"
                [link]="true"
                styleClass="text-400 text-xs"></p-button>
    </div>
    <div class="col-12">
      <div class="grid">
        <div class="col-3">
          <div class="play-box p-4">
            <div class="flex flex-column align-items-center gap-2">
              <p-image src="https://i.scdn.co/image/ab67706f0000000254473de875fea0fd19d39037"
                       imageClass="border-round w-full"></p-image>
              <div class="play-button">
                <p-button [icon]="audioElement1.paused ? 'pi pi-caret-right' : 'pi pi pi-pause'"
                          (click)="playPauseAudio1()"
                          [rounded]="true"
                          size="small"
                          severity="success"></p-button>
              </div>
              <div class="flex flex-column align-items-start gap-2">
                <span class="text-sm font-bold">lofi beats</span>
                <span class="text-xs line-height-3">chill beats, lofi vibes, new tracks every week...</span>
              </div>
            </div>
          </div>
        </div>
        <div class="col-3">
          <div class="play-box p-4">
            <div class="flex flex-column align-items-center gap-2">
              <p-image src="https://i.scdn.co/image/ab67706f0000000277c91d9f09e4deb8a2ede4cb"
                       imageClass="border-round w-full"></p-image>
              <div class="play-button">
                <p-button [icon]="audioElement2.paused ? 'pi pi-caret-right' : 'pi pi pi-pause'"
                          (click)="playPauseAudio2()"
                          [rounded]="true"
                          size="small"
                          severity="success"></p-button>
              </div>
              <div class="flex flex-column align-items-start gap-2">
                <span class="text-sm font-bold">Christmas Hits</span>
                <span class="text-xs line-height-3">The biggest Christmas songs of all time.</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
